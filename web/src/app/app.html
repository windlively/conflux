<div class="app">
  <!-- macOS 隐藏标题栏后，这条带子负责拖动窗口，与系统标题栏同高 -->
  <div class="titlebar-drag" data-tauri-drag-region></div>

  <app-sidebar />

  <main class="content">
    <div class="content-inner">
      @if (ui.view() === 'tasks' && updater.availableVersion(); as version) {
        <div class="update-banner">
          <app-icon name="update" />
          <span>发现新版本 v{{ version }}</span>
          <button matButton (click)="ui.showSettings()">去更新</button>
        </div>
      }

      @if (messageText(); as text) {
        <div class="message" animate.enter="message-in" animate.leave="message-out">
          {{ text }}
          <button matButton (click)="dismiss()"><app-icon name="close" />关闭</button>
        </div>
      }

      @if (ui.view() === 'settings') {
        <app-settings-page />
      } @else {
        <app-task-list [tasks]="store.visible()" [emptyText]="emptyText()" />
      }
    </div>
  </main>
</div>
