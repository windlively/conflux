[package]
name = "conflux"
version = "0.1.0"
description = "川流 Conflux —— 跨平台多协议下载工具"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "conflux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
percent-encoding = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v4"] }
tauri-plugin-dialog = "2.7.3"
window-vibrancy = "0.6"
# BT／磁力：进程内引擎。default-tls 除了给 tracker／种子 URL 走 HTTPS 之外，
# 还负责打开 sha1 后端（librqbit 以 default-features = false 引用 librqbit-core，
# 不选任一 tls feature 会缺少 sha1 实现而编译失败）；http-api-client 用不上，关掉。
librqbit = { version = "9.0.1", default-features = false, features = ["default-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

# 液态玻璃：NSGlassEffectView 只在 macOS 26 才有绑定，这里手动引 objc2 直连系统类，
# 版本与 window-vibrancy 锁定的保持一致，避免编译两份
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSResponder",
  "NSView",
  "NSGlassEffectView",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
