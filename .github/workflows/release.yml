name: release

# 打 tag（v*）自动出两平台安装包并发到 Release；也可以手动触发，只构建产物不建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 发布用的 tag（例如 v0.1.0）；留空则只构建、不创建 Release
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只出 Apple Silicon；Intel Mac 需要 aarch64 之外的第二次 macOS 构建，暂时不做
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifacts: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifacts: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/conflux.exe

    runs-on: ${{ matrix.platform }}
    env:
      # 打 tag 推送时用 tag 名；手动触发时用输入框里的 tag
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    defaults:
      run:
        # Windows 上的默认 shell 是 pwsh，侧车脚本是 bash 写的，统一成 bash（windows-latest 自带 Git Bash）
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/ed2k/go.mod
          cache-dependency-path: sidecar/ed2k/go.sum

      # 侧车按目标三元组命名放进 src-tauri/binaries/，externalBin 会把它一起打进安装包
      - name: 构建 ed2k 侧车
        run: bash sidecar/ed2k/build.sh

      - name: 构建命令行客户端
        run: bash cli/build.sh ${{ matrix.target }}

      - name: 安装前端与 CLI 依赖
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile

      - name: 构建并发到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG != '' && format('川流 Conflux {0}', env.RELEASE_TAG) || '' }}
          releaseDraft: false
          # 只是兜底：真正的正文由后面的 notes 作业用 docs/releases/<tag>.md 覆盖
          releaseBody: |
            本版更新内容见仓库 `docs/releases/${{ env.RELEASE_TAG }}.md`。
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}
            --config '{"build":{"frontendDist":"../web/dist","beforeBuildCommand":"pnpm --dir web build"}}'

      - uses: actions/upload-artifact@v4
        with:
          name: conflux-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn

  # tauri-action 建 Release 时只能给一段写死的正文，而两个平台的作业会先后写同一个
  # Release：谁后跑完谁把正文覆盖回去。所以等两边的产物都传完，单独用版本说明再写一次。
  notes:
    needs: build
    # 手动触发且没填 tag 时不会建 Release，跳过
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 用本版更新内容覆盖 Release 正文
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          body="$(mktemp)"
          if [ -f "$notes" ]; then
            cat "$notes" >> "$body"
          else
            echo "本版没有单独的更新说明。" >> "$body"
            echo "::warning::没有找到 $notes，Release 正文只写安装说明"
          fi
          # 更新内容在前，安装说明在后，中间一条分隔线
          printf '\n---\n\n' >> "$body"
          cat docs/releases/install.md >> "$body"
          gh release edit "$RELEASE_TAG" --notes-file "$body"
