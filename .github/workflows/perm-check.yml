name: perm-check

# 临时诊断用：确认 GITHUB_TOKEN 能不能创建 Release。用完即删。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 打印权限并试建草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== 建草稿 =="
          if gh api -X POST "repos/${{ github.repository }}/releases" \
               -f tag_name=v0.3.0 -f name=perm-check -F draft=true > /tmp/rel.json 2>/tmp/rel.err; then
            id=$(jq -r .id /tmp/rel.json)
            echo "CREATE_OK id=$id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" && echo "DELETED"
          else
            echo "CREATE_FAILED"
            cat /tmp/rel.err
          fi
